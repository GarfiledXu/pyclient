[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyclient"
version = "0.1.0"
description = "NVS 上位机客户端核心库"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "YourName", email = "your.email@example.com" }
]
# 依赖声明：安装包时会自动安装这些库
dependencies = [
    "loguru",
    "tomli; python_version < '3.11'",
]

[tool.setuptools]
# 关键配置：告知源码在 src 目录下
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
# 自动寻找 src 目录下的所有包（包含 pyclient, pyclient.core 等）
where = ["src"]

[tool.setuptools.package-data]
# 关键配置：确保单数命名的 asset 文件夹下的 toml 文件被打包
"pyclient.asset" = ["*.toml"]

[project.scripts]
# 可选：如果你想在命令行直接输入 pyclient 就启动程序
# pyclient = "pyclient.main:main"